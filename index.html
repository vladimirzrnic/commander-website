<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Commander d.o.o</title>

    <style>
    @font-face {
        font-family: "DIN Web";
        src: url("dinpro.otf") format("truetype");
        font-weight: 400;
        font-style: normal;
    }

    /* =====================
       THEME VARIABLES
       ===================== */
    :root{
        color-scheme: light;
        --bg: #ffffff;
        --text: #111111;
        --muted: rgba(0,0,0,0.65);

        --toggle-bg: rgba(0,0,0,0.08);
        --toggle-border: rgba(0,0,0,0.12);
        --thumb: #ffffff;
        --shadow: 0 8px 20px rgba(0,0,0,0.14);
    }

    html[data-theme="dark"]{
        color-scheme: dark;
        --bg: #0b0b0f;
        --text: #f2f2f7;
        --muted: rgba(255,255,255,0.70);

        --toggle-bg: rgba(255,255,255,0.12);
        --toggle-border: rgba(255,255,255,0.16);
        --thumb: #1c1c22;
        --shadow: 0 12px 26px rgba(0,0,0,0.45);
    }

    body {
        margin: 0;
        font-family: "DIN Web", sans-serif;
        color: var(--text);
        background: var(--bg);
        scroll-behavior: smooth;
    }

    /* =====================
       MAP
       ===================== */
    .map {
        width: 100%;
        height: 40vh;
        min-height: 250px;
        border: none;
    }

    /* =====================
       TOGGLE BAR
       ===================== */
    .topbar{
        position: relative;
    }

    .theme-toggle-wrap{
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 10;
    }

    .theme-toggle{
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 999px;
        border: 1px solid var(--toggle-border);
        background: rgba(255,255,255,0.55);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    html[data-theme="dark"] .theme-toggle{
        background: rgba(0,0,0,0.35);
    }

    .theme-icon{
        font-size: 16px;
        line-height: 1;
        opacity: 0.8;
        user-select: none;
    }

    .theme-track{
        position: relative;
        width: 46px;
        height: 28px;
        border-radius: 999px;
        background: var(--toggle-bg);
        box-shadow: inset 0 0 0 1px var(--toggle-border);
    }

    .theme-thumb{
        position: absolute;
        top: 3px;
        left: 3px;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: var(--thumb);
        box-shadow: var(--shadow);
        transition: transform 220ms cubic-bezier(.2,.8,.2,1);
    }

    html[data-theme="dark"] .theme-thumb{
        transform: translateX(18px);
    }

    /* =====================
       LOGO
       ===================== */
    .logo-container {
        text-align: center;
        margin: 40px 0 20px 0;
    }

    .logo {
        width: 80%;
        max-width: 900px;
    }

    /* =====================
       CONTACT
       ===================== */
    .contact {
        max-width: 900px;
        margin: auto;
        padding: 20px;
    }
