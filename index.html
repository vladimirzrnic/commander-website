<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- SEO -->
  <title>COMMANDER D.O.O BEOGRAD</title>
  <meta name="description" content="Commander d.o.o Beograd — konsultantske usluge u oblasti telekomunikacionih i signalnih instalacija.">
  <link rel="canonical" href="https://commander.rs/">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <style>
    @font-face {
      font-family: "DIN Web";
      src: url("dinpro.otf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }

    /* =====================
       THEME VARIABLES
       ===================== */
    :root{
      color-scheme: light;
      --bg: #ffffff;
      --text: #111111;
      --muted: rgba(0,0,0,0.65);

      --toggle-bg: rgba(0,0,0,0.08);
      --toggle-border: rgba(0,0,0,0.12);
      --thumb: #ffffff;
      --shadow: 0 8px 20px rgba(0,0,0,0.14);
    }

    html[data-theme="dark"]{
      color-scheme: dark;
      --bg: #0b0b0f;
      --text: #f2f2f7;
      --muted: rgba(255,255,255,0.70);

      --toggle-bg: rgba(255,255,255,0.12);
      --toggle-border: rgba(255,255,255,0.16);
      --thumb: #1c1c22;
      --shadow: 0 12px 26px rgba(0,0,0,0.45);
    }

    body {
      margin: 0;
      font-family: "DIN Web", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    /* =====================
       MAP
       ===================== */
    .map-wrap{
      position: relative;
    }

    .map{
      width: 100%;
      height: 40vh;
      min-height: 260px;
    }

    .map-overlay{
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:0;
      transition:opacity 200ms ease;
    }

    html[data-theme="dark"] .map-overlay{
      opacity:1;
      background:rgba(0,0,0,0.35);
      mix-blend-mode:multiply;
    }

    /* =====================
       TOGGLE
       ===================== */
    .topbar{
      position:relative;
    }

    .theme-toggle-wrap{
      position:absolute;
      top:14px;
      right:14px;
      z-index:10;
    }

    .theme-toggle{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid var(--toggle-border);
      background:rgba(255,255,255,0.55);
      backdrop-filter:blur(10px);
      cursor:pointer;
    }

    html[data-theme="dark"] .theme-toggle{
      background:rgba(0,0,0,0.35);
    }

    .theme-track{
      width:46px;
      height:28px;
      border-radius:999px;
      background:var(--toggle-bg);
      position:relative;
    }

    .theme-thumb{
      position:absolute;
      top:3px;
      left:3px;
      width:22px;
      height:22px;
      border-radius:50%;
      background:var(--thumb);
      box-shadow:var(--shadow);
      transition:transform .2s ease;
    }

    html[data-theme="dark"] .theme-thumb{
      transform:translateX(18px);
    }

    /* =====================
       LOGO
       ===================== */
    .logo-container{
      text-align:center;
      margin:40px 0 20px;
    }

    .logo{
      width:80%;
      max-width:900px;
    }

    /* =====================
       CONTACT
       ===================== */
    .contact{
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    h2{
      text-align:center;
      margin-bottom:30px;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    td{
      padding:6px 4px;
      vertical-align:top;
    }

    td:first-child{
      font-weight:bold;
      width:40%;
      color:var(--muted);
    }
  </style>
</head>

<body>

<!-- MAP + TOGGLE -->
<div class="topbar">

  <div class="theme-toggle-wrap">
    <button class="theme-toggle" id="themeToggle" type="button">
      <span class="theme-track">
        <span class="theme-thumb"></span>
      </span>
    </button>
  </div>

  <div class="map-wrap">
    <div id="map" class="map"></div>
    <div class="map-overlay"></div>
  </div>

</div>

<!-- LOGO -->
<div class="logo-container">
  <img src="logo.png" alt="Commander logo" class="logo">
</div>

<!-- CONTACT -->
<section class="contact">
  <h2>Contact / Kontakt</h2>
  <table>
    <tr><td>Company:</td><td>COMMANDER D.O.O BEOGRAD</td></tr>
    <tr><td>Address:</td><td>Nova 2 20, Beograd</td></tr>
    <tr><td>Email:</td><td>office@commander.rs</td></tr>
    <tr><td>Phone:</td><td>+381 64 3333 431</td></tr>
  </table>
</section>

<!-- THEME SCRIPT -->
<script>
  (function(){
    const root=document.documentElement;
    const btn=document.getElementById("themeToggle");
    const saved=localStorage.getItem("theme");
    const prefersDark=window.matchMedia("(prefers-color-scheme: dark)").matches;

    function setTheme(t){
      root.setAttribute("data-theme",t);
      localStorage.setItem("theme",t);
    }

    setTheme(saved || (prefersDark ? "dark" : "light"));

    btn.addEventListener("click",()=>{
      setTheme(root.getAttribute("data-theme")==="dark"?"light":"dark");
    });
  })();
</script>

<!-- GOOGLE MAP -->
<script>
  function initMap(){
    const location = {
      lat: 44.75757818742131,
      lng: 20.413038574132614
    };

    const map = new google.maps.Map(document.getElementById("map"), {
      zoom: 16,
      center: location,
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: false
    });

    new google.maps.Marker({
      position: location,
      map,
      title: "COMMANDER D.O.O",
      icon: {
        url: "/logo.png",
        scaledSize: new google.maps.Size(48,48),
        anchor: new google.maps.Point(24,24)
      }
    });
  }
</script>

<!-- GOOGLE MAPS API (KEY SE UBACUJE PREKO GITHUB ACTIONS) -->
<script
  src="https://maps.googleapis.com/maps/api/js?key=__GOOGLE_MAPS_API_KEY__&callback=initMap"
  async defer>
</script>

</body>
</html>
